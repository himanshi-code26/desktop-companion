name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install system dependencies for Qt and X11 (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libxkbcommon0 libxcb-cursor0 \
            xvfb x11-utils

      - name: Install project (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check src tests

      # Linux runners have no display server at all, which is a
      # different problem from Qt's own headless support: PySide6 can
      # render with QT_QPA_PLATFORM=offscreen without any X server, but
      # pyautogui talks to Xlib directly and needs a *real* (even if
      # virtual) display to exist, or its import fails. `xvfb-run`
      # starts a virtual X server, exports DISPLAY for the wrapped
      # command, and tears it down afterwards - so pyautogui's
      # dependency check succeeds for real here, not just gracefully.
      - name: Run tests (Linux, under Xvfb)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: xvfb-run -a --server-args="-screen 0 1280x1024x24" pytest --cov=desktop_pet --cov-report=term-missing

      - name: Run tests (Windows/macOS)
        if: runner.os != 'Linux'
        run: pytest --cov=desktop_pet --cov-report=term-missing
